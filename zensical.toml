[project]
site_name = "Landing"
repo_url = "https://github.com/bubbuild/landing"
site_url = "https://getlanding.dev/"
site_description = "Explain CI failures, delegate fixes, and review evidence with your own tools."
site_author = "Chojan Shang"
extra_javascript = ["assets/javascripts/api-reference.js"]
extra_css = ["assets/stylesheets/api-reference.css"]
edit_uri = "edit/main/docs/"
repo_name = "bubbuild/landing"
copyright = 'Maintained by <a href="https://github.com/PsiACE">PsiACE</a>. Powered by <a href="https://bub.build/">Bub</a> and <a href="https://tape.systems/">tape.systems</a>.'

nav = [
    { "Landing" = "index.md" },
    { "Get started" = "get-started.md" },
    { "Working with Landing" = "working-with-landing.md" },
    { "Make Landing work for you" = "make-it-yours.md" },
    { "Guides" = [
        { "Local use" = "guides/local.md" },
        { "CI" = "guides/ci.md" },
        { "MCP servers" = "guides/mcp.md" },
        { "GitHub" = "guides/github.md" },
        { "Server and webhooks" = "guides/server.md" },
        { "Containers and ONCE" = "guides/deploy.md" },
        { "Replication and recovery" = "guides/recovery.md" },
        { "Troubleshooting" = "guides/troubleshooting.md" },
    ] },
    { "Reference" = [
        { "CLI" = "reference/cli.md" },
        { "Configuration" = "reference/configuration.md" },
        { "HTTP" = "reference/http.md" },
        { "API reference" = "reference/api.md" },
        { "Python API" = "reference/python.md" },
    ] },
    { "Develop and dogfood" = "development.md" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src/landing"]

[project.theme]
language = "en"
logo = "assets/images/landing.png"
favicon = "assets/images/favicon.png"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]


[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Lora"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "brown"
accent = "teal"
toggle.icon =  "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "brown"
accent = "amber"
toggle.icon =  "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bubbuild/landing"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/landing"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.attr_list]
