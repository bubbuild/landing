services:
  landing:
    build:
      context: .
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${SETUPTOOLS_SCM_PRETEND_VERSION:-}
    image: ${LANDING_IMAGE:-ghcr.io/bubbuild/landing:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      LANDING_RUNNER: gha
      LANDING_GITHUB_WEBHOOK_SECRET: ${LANDING_GITHUB_WEBHOOK_SECRET:?Set LANDING_GITHUB_WEBHOOK_SECRET}
      LANDING_GITHUB_WORKFLOW: ${LANDING_GITHUB_WORKFLOW:-landing-execute.yml}
      LANDING_GITHUB_REF: ${LANDING_GITHUB_REF:-}
      GH_TOKEN: ${GH_TOKEN:?Set GH_TOKEN with Actions write access}
    stop_grace_period: 30s
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
