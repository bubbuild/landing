name: Bug report
description: Tell us where Landing behaved differently from what you expected.
title: 'bug: '
labels:
  - bug
body:
  - type: input
    id: landing-version
    attributes:
      label: Landing version or commit
      placeholder: 'For example: commit 3ff4888'
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Include the observed output or error, with credentials removed.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: How can we reproduce it?
      description: Include minimal commands or a request, relevant configuration, and the execution environment. State any missing evidence.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Link related issues or evidence, and suggest an acceptance check if useful.
