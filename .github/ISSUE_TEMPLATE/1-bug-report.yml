name: Bug Report
description: Report a reproducible problem with Landing.
title: 'bug: '
labels:
- bug
body:
- type: input
  id: landing-version
  attributes:
    label: Landing version or commit
    description: Specify a release or commit where you reproduced the bug.
    placeholder: 'For example: commit 3ff4888'
  validations:
    required: true
- type: input
  id: affected-component
  attributes:
    label: Affected interface or component
    description: Name the CLI, HTTP server, CI adapter, container, model provider or other affected component.
    placeholder: 'For example: CLI explain using DeepSeek'
  validations:
    required: true
- type: textarea
  id: describe-bug
  attributes:
    label: Describe the bug
    description: State the observed problem. Label hypotheses and missing evidence.
    placeholder: Describe the bug...
  validations:
    required: true
- type: textarea
  id: steps-to-reproduce
  attributes:
    label: Steps to Reproduce
    description: Provide minimal commands or a request, sanitized configuration, and the environment where you observed the failure.
    placeholder: Provide a minimal, self-contained reproduction.
  validations:
    required: true
- type: textarea
  id: actual-behavior
  attributes:
    label: Actual Behavior
    description: Include the actual output, error, or other observable behavior.
    placeholder: Explain what happened and include relevant sanitized logs.
  validations:
    required: true
- type: textarea
  id: expected-behavior
  attributes:
    label: Expected Behavior
    description: A clear and concise description of what you expected to happen.
    placeholder: Explain what you expected to happen...
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: What observable behavior or check would show that the problem is fixed?
  validations:
    required: false
- type: textarea
  id: additional-context
  attributes:
    label: Additional Context
    description: Add any other context about the problem here.
    placeholder: Additional details...
  validations:
    required: false
- type: checkboxes
  id: willing-to-submit-pr
  attributes:
    label: Are you willing to submit a PR to fix this bug?
    description: Let us know if you are willing to contribute a fix by submitting a Pull Request.
    options:
    - label: Yes, I would like to submit a PR.
