name: Feature request
description: Describe work you would like Landing to help with.
title: 'new feature: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem-solution
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would a useful result look like?
      description: Describe the user action and expected outcome. Include a proposed approach if you have one.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Link related discussions or examples.
