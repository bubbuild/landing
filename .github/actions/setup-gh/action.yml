name: Set up GitHub CLI
description: Install the GitHub CLI version supporting pinned, on-demand skills.
runs:
  using: composite
  steps:
    - name: Install gh
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$RUNNER_TEMP/landing-gh"
        gh release download v2.97.0 --repo cli/cli --pattern gh_2.97.0_linux_amd64.tar.gz --dir "$RUNNER_TEMP/landing-gh" --clobber
        tar -xzf "$RUNNER_TEMP/landing-gh/gh_2.97.0_linux_amd64.tar.gz" --strip-components=2 -C "$RUNNER_TEMP/landing-gh" gh_2.97.0_linux_amd64/bin/gh
        echo "$RUNNER_TEMP/landing-gh" >> "$GITHUB_PATH"
