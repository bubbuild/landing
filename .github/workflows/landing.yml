name: Landing dogfood

on:
  workflow_call:
    secrets:
      LANDING_API_KEY:
        description: Provider API key
        required: false
      LANDING_GITHUB_TOKEN:
        description: Optional publication token; defaults to the workflow token
        required: false
    inputs:
      command:
        type: string
        default: review
      number:
        type: string
        default: '0'
      head:
        type: string
        default: ''
      run-id:
        type: string
        default: ''
      checked-revision:
        type: string
        default: ''
      delivery-key:
        type: string
        required: true
      instruction:
        type: string
        default: Carry out the delegated action using repository guidance and supplied evidence.
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [triage, fix, review, explain]
        default: review
      number:
        description: Issue or PR number (required for fixer)
        type: string
        default: '0'
      instruction:
        description: Delegated action
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: landing-${{ github.event_name }}-${{ inputs.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  action:
    name: Landing action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: 2.97.0
          github-token: ${{ env.GH_TOKEN }}
      - name: Prepare agent skills
        run: |
          scripts/prepare-skills.sh "$RUNNER_TEMP/landing-skills"
          echo "LANDING_SKILL_DIRS=[\"$RUNNER_TEMP/landing-skills\"]" >> "$GITHUB_ENV"
      - name: Prepare GitHub Git authentication
        run: |
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          gh auth setup-git
      - name: Carry out the delegated action
        uses: ./
        env:
          LANDING_CONFIG: .github/landing.yml
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          command: ${{ inputs.command || 'review' }}
          number: ${{ inputs.number || '0' }}
          head: ${{ inputs.head }}
          run-id: ${{ inputs.run-id }}
          checked-revision: ${{ inputs.checked-revision }}
          delivery-key: ${{ inputs.delivery-key || format('manual:{0}:{1}', github.run_id, github.run_attempt) }}
          instruction: ${{ inputs.instruction }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
