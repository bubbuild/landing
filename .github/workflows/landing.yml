name: Landing dogfood

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: gatekeeper
      number:
        type: string
        default: '0'
      head:
        type: string
        default: ''
      run-id:
        type: string
        default: ''
      checked-revision:
        type: string
        default: ''
      delivery-key:
        type: string
        required: true
      instruction:
        type: string
        default: Review the current candidate against acceptance criteria and independent native checks. Ignore this feedback job when assessing check completion. Use gh to inspect the full diff and linked issues. Record a decision and explain concrete findings.
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [issuer, fixer, gatekeeper, explainer]
        default: gatekeeper
      number:
        description: Issue or PR number (required for fixer)
        type: string
        default: '0'
      instruction:
        description: Delegated action
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: landing-${{ github.event_name }}-${{ inputs.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  action:
    name: Landing action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Carry out the delegated action using Bub and gh
        env:
          GH_TOKEN: ${{ github.token }}
          LANDING_CHECK_WORKFLOW: main.yml
          BUB_MODEL: ${{ vars.LANDING_MODEL }}
          BUB_API_KEY: ${{ secrets.LANDING_API_KEY }}
          BUB_API_BASE: ${{ vars.LANDING_API_BASE }}
          BUB_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          BUB_MODEL_TIMEOUT_SECONDS: '120'
          LANDING_MODE: ${{ inputs.mode || 'gatekeeper' }}
          LANDING_NUMBER: ${{ inputs.number || '0' }}
          LANDING_HEAD: ${{ inputs.head }}
          LANDING_NATIVE_RUN: ${{ inputs.run-id }}
          LANDING_CHECKED_REVISION: ${{ inputs.checked-revision }}
          LANDING_DELIVERY_KEY: ${{ inputs.delivery-key || format('manual:{0}:{1}', github.run_id, github.run_attempt) }}
          LANDING_INSTRUCTION: ${{ inputs.instruction }}
        run: |
          test -n "$BUB_MODEL" && test -n "$BUB_API_KEY"
          if [[ -z "$BUB_API_BASE" ]]; then unset BUB_API_BASE; fi
          uv run python -m landing.adapters.github "$LANDING_MODE"             --number "$LANDING_NUMBER" --head "$LANDING_HEAD" --run-id "$LANDING_NATIVE_RUN" --checked-revision "$LANDING_CHECKED_REVISION"             --instruction "$LANDING_INSTRUCTION" --delivery-key "$LANDING_DELIVERY_KEY"             --db "$RUNNER_TEMP/landing/landing.sqlite3"             --check 'uv run pytest tests' --check 'uv run ty check' --check 'uv run zensical build -s'
      - name: Publish evidence summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/landing/summary.md" ]]; then
            cat "$RUNNER_TEMP/landing/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
