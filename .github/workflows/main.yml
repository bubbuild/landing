name: Main

on:
  workflow_dispatch:
    inputs:
      number:
        description: Candidate PR number (zero for branch maintenance)
        type: string
        default: '0'
      head:
        description: Candidate head to review
        type: string
        default: ''
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run ty check



  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run zensical build -s

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Build the ONCE-compatible image
        run: docker build -t landing:ci .
      - name: Check the container and both backup recovery paths
        run: uv run python tests/container_smoke.py --image landing:ci

  landing-feedback:
    name: Landing feedback
    needs: [quality, tests-and-type-check, check-docs, container]
    if: >-
      always() && !cancelled() && vars.LANDING_MODEL != '' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/landing.yml
    with:
      mode: ${{ (github.event_name == 'pull_request' || (inputs.number != '' && inputs.number != '0')) && 'gatekeeper' || 'issuer' }}
      number: ${{ format('{0}', github.event.pull_request.number || inputs.number || 0) }}
      head: ${{ github.event.pull_request.head.sha || inputs.head || '' }}
      run-id: ${{ format('{0}', github.run_id) }}
      checked-revision: ${{ github.sha }}
      delivery-key: ${{ format('checks:{0}:{1}', github.run_id, github.run_attempt) }}
      instruction: >-
        Native checks completed: ${{ toJSON(needs) }}.
        For a PR, review the full candidate and linked acceptance criteria using gh.
        These checks ran on ${{ github.sha }}; inspect the candidate head separately.
        Ignore the Landing feedback job when assessing check completion. Record a decision.
        For the default branch, maintain one CI issue per recurring problem using gh:
        search open and closed issues before creating, reopen a real recurrence,
        and close only when the issue's acceptance criteria are verified at the current default-branch revision.
        Keep the reply brief; report concrete findings instead of recapping the diff or listing all successful checks.
        Do not create work for healthy checks with no existing problem.
    secrets: inherit
