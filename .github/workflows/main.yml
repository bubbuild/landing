name: Main

on:
  workflow_dispatch:
    inputs:
      number:
        description: Candidate PR number (zero for branch maintenance)
        type: string
        default: '0'
      head:
        description: Candidate head to review
        type: string
        default: ''
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: landing-ci-${{ github.repository_id }}-${{ github.event.pull_request.number || (inputs.number != '' && inputs.number != '0' && inputs.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (inputs.number != '' && inputs.number != '0') }}

jobs:
  feedback-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      implementation: ${{ steps.paths.outputs.implementation }}
      documentation: ${{ steps.paths.outputs.documentation }}
    steps:
      - uses: dorny/paths-filter@v4
        id: paths
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            implementation:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!CONTRIBUTING.md'
              - '!site/**'
            documentation:
              - 'docs/**'
              - 'README.md'
              - 'CONTRIBUTING.md'


  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run ty check



  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: make docs-test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Build the ONCE-compatible image
        run: docker build -t landing:ci .
      - name: Check the container and both backup recovery paths
        run: uv run python tests/container_smoke.py --image landing:ci

  landing-feedback:
    name: Landing feedback
    needs: [quality, tests-and-type-check, check-docs, container, feedback-scope]
    if: >-
      always() && !cancelled() && vars.LANDING_MODEL != '' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft &&
        (needs.feedback-scope.outputs.implementation == 'true' ||
         needs.feedback-scope.outputs.documentation == 'true' || contains(needs.*.result, 'failure')))) &&
      (github.event_name == 'pull_request' || (inputs.number != '' && inputs.number != '0') ||
       contains(needs.*.result, 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: 2.102.0
          github-token: ${{ env.GH_TOKEN }}
      - name: Prepare agent skills
        run: |
          scripts/prepare-skills.sh "$RUNNER_TEMP/landing-skills"
          echo "LANDING_SKILL_DIRS=[\"$RUNNER_TEMP/landing-skills\"]" >> "$GITHUB_ENV"
      - name: Prepare GitHub Git authentication
        run: |
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          gh auth setup-git
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare MCP tools
        run: |
          npx --yes @playwright/mcp@0.0.83 --help > /dev/null
          mkdir -p .ci-state/browser
      - name: Carry out the delegated action
        id: landing
        timeout-minutes: 20
        continue-on-error: true
        uses: ./
        env:
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          command: ${{ (github.event_name == 'pull_request' || (inputs.number != '' && inputs.number != '0')) && 'review' || 'triage' }}
          number: ${{ format('{0}', github.event.pull_request.number || inputs.number || 0) }}
          head: ${{ github.event.pull_request.head.sha || inputs.head || '' }}
          run-id: ${{ format('{0}', github.run_id) }}
          checked-revision: ${{ github.sha }}
          delivery-key: ${{ format('checks:{0}:{1}', github.run_id, github.run_attempt) }}
          instruction: >-
            Native checks: quality=${{ needs.quality.result }}, tests-and-type-check=${{ needs.tests-and-type-check.result }}, check-docs=${{ needs.check-docs.result }}, container=${{ needs.container.result }}.
            Ignore the Landing feedback job when assessing native check completion.
            ${{ (github.event_name == 'pull_request' || (inputs.number != '' && inputs.number != '0')) && 'Review the affected behavior in this PR. Use supplied check results and relevant review history; investigate only unresolved questions and publish useful findings or a brief clean verdict.' || 'Triage only the native failures in these supplied results. Read the affected job logs using gh, reuse a matching issue, and record an actionable current problem. Do not create issues for resolved historical failures.' }}
            ${{ github.event_name == 'pull_request' && format('Selected scope: implementation={0}, documentation={1}. Read the relevant diff through gh. Generated site/** output is excluded; inspect its source when needed. For documentation, assess command, configuration and workflow accuracy. For implementation, assess affected user behavior.', needs.feedback-scope.outputs.implementation || 'false', needs.feedback-scope.outputs.documentation || 'false') || '' }}
      - name: Report unsuccessful feedback
        if: ${{ !cancelled() && steps.landing.outcome == 'failure' }}
        run: echo "::warning::Landing feedback failed. Inspect the task logs and artifact; native checks determine acceptance."
      - name: Collect browser evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/landing/browser"
          if [ -d "$GITHUB_WORKSPACE/.ci-state/browser" ]; then
            cp -a "$GITHUB_WORKSPACE/.ci-state/browser/." "$RUNNER_TEMP/landing/browser/"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
