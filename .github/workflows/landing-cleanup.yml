name: Landing cleanup

# A closed-only trigger keeps merged-branch cleanup away from the review matrix:
# adding `closed` to Main's pull_request types would also rerun every native job.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  merged-branch:
    # Only an actually merged pull request may delete its own head branch.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Read the action from the trusted default branch, never from the merged candidate,
      # because this job holds a write token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          delete-merged-branch: 'true'
