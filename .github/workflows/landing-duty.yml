name: Landing duty

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [dependabot_alert]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [release-main, Main]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  vulnerability-alerts: read

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' && github.event.action == 'dependabot_alert') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Main' &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch != github.event.repository.default_branch)) &&
        github.event.workflow_run.conclusion == 'failure' && vars.LANDING_BUMP_ON_FAILURE != 'false') ||
       contains(github.event.comment.body, '/landing'))
    concurrency:
      group: landing-duty-${{ github.repository_id }}-${{ github.event.issue.number || github.event.pull_request.number || (github.event.workflow_run.event == 'release' && github.event.workflow_run.id) || (github.event.client_payload.alert_number && format('alert-{0}', github.event.client_payload.alert_number)) || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || 'dependencies' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      LANDING_MODEL: ${{ vars.LANDING_MODEL }}
      LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
      LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS }}
      LANDING_CONFIG: .github/landing.yml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: 2.102.0
          github-token: ${{ env.GH_TOKEN }}
      - name: Prepare agent skills
        run: |
          scripts/prepare-skills.sh "$RUNNER_TEMP/landing-skills"
          echo "LANDING_SKILL_DIRS=[\"$RUNNER_TEMP/landing-skills\"]" >> "$GITHUB_ENV"
      - name: Prepare GitHub Git authentication
        run: |
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          gh auth setup-git
      - name: Read dependency update publishing identity
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'release' && startsWith(github.event.workflow_run.head_branch, 'deps/landing-')
        run: |
          echo "LANDING_PUBLISHING_ACTOR=$(gh api graphql -f query='{viewer{login}}' --jq .data.viewer.login)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare MCP tools
        run: |
          npx --yes @playwright/mcp@0.0.83 --help > /dev/null
          mkdir -p .ci-state/browser
      - name: Handle the delegated comment or release event
        if: >-
          github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release')
        uses: ./
        env:
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
        with:
          trust: ${{ vars.LANDING_TRUST }}
          upstream-workflow: release-main
          command: triage
          checked-revision: ${{ github.event_name != 'workflow_run' && github.sha || '' }}
          delivery-key: ${{ format('duty:{0}', github.event.comment.id || github.run_id) }}
          # Static triage policy lives in .github/landing.yml mode instructions.
          instruction: >-
            Follow the triggering release only. Its conclusion is ${{ github.event.workflow_run.conclusion }}.
      - name: Handle dependency updates
        if: >-
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
          github.event_name == 'repository_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'release')
        uses: ./
        env:
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
        with:
          # Static dependency policy, the actor base and the bump-on-failure default live in
          # .github/landing.yml. This step supplies only the dynamic publishing identity and the
          # operator's additional actors, unioned with the configured base.
          trust: ${{ vars.LANDING_TRUST }}
          upstream-workflow: Main
          bump-on-failure: ${{ vars.LANDING_BUMP_ON_FAILURE }}
          dependency-update-actor-additions: |
            ${{ env.LANDING_PUBLISHING_ACTOR }}
            ${{ vars.LANDING_DEPENDENCY_UPDATE_ACTORS }}
          command: bump
          checked-revision: ${{ github.event_name != 'workflow_run' && github.sha || '' }}
          delivery-key: ${{ github.event_name != 'workflow_run' && format('duty:{0}', github.run_id) || '' }}
          instruction: Carry out the delegated dependency maintenance.
      - name: Collect browser evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/landing/browser"
          if [ -d "$GITHUB_WORKSPACE/.ci-state/browser" ]; then
            cp -a "$GITHUB_WORKSPACE/.ci-state/browser/." "$RUNNER_TEMP/landing/browser/"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: landing-duty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
