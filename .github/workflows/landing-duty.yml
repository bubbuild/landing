name: Landing duty

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [release-main]
    types: [completed]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: landing-duty-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id || 'daily' }}
  cancel-in-progress: false

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      ((github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
       (github.event.comment.user.type != 'Bot' &&
        (github.event_name == 'pull_request_review_comment' || contains(github.event.comment.body, '/landing '))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: 2.97.0
          github-token: ${{ env.GH_TOKEN }}
      - name: Prepare agent skills
        run: |
          scripts/prepare-skills.sh "$RUNNER_TEMP/landing-skills"
          echo "LANDING_SKILL_DIRS=[\"$RUNNER_TEMP/landing-skills\"]" >> "$GITHUB_ENV"
      - name: Prepare GitHub Git authentication
        run: |
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          gh auth setup-git
      - name: Prepare current maintenance issues
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        id: issues
        run: gh issue list --state open --limit 100 --json number,title,body,url --jq '"issues=" + tojson' >> "$GITHUB_OUTPUT"
      - name: Handle the event or daily maintenance
        uses: ./
        env:
          LANDING_CONFIG: .github/landing.yml
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          command: triage
          checked-revision: ${{ github.event_name != 'workflow_run' && github.sha || '' }}
          delivery-key: ${{ format('duty:{0}', github.event.comment.id || github.run_id) }}
          instruction: >-
            ${{ github.event_name == 'workflow_run' && format('Follow up release run {0}, conclusion {1}. Inspect its failed jobs or verify recovery for a matching open issue; other runs are outside this task.', github.event.workflow_run.id, github.event.workflow_run.conclusion) || 'Follow up these current open issues using their acceptance criteria and the latest relevant evidence. Update or close issues when supported; investigate missing evidence only for the affected issue. Do not scan resolved historical failures for new work.' }}
            Current open issues: ${{ steps.issues.outputs.issues || '[]' }}.
            Reuse the supplied issue details. Do not create work for healthy checks or claim deployment recovery from a build. Reply briefly with useful actions or unresolved limitations.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-duty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
