name: Landing duty

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [release-main]
    types: [completed]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: landing-duty-${{ github.event.issue.number || github.event.workflow_run.id || 'daily' }}
  cancel-in-progress: false

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@landing ')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Handle the event or daily maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          LANDING_CHECK_WORKFLOW: main.yml
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
          LANDING_DELIVERY_KEY: ${{ format('{0}:{1}', github.event.comment.id || github.run_id, github.run_attempt) }}
        run: |
          test -n "$LANDING_MODEL" && test -n "$LANDING_API_KEY"
          uv run python -m landing.adapters.github issuer             --event "$GITHUB_EVENT_PATH" --delivery-key "$LANDING_DELIVERY_KEY"             --db "$RUNNER_TEMP/landing/landing.sqlite3"             --instruction 'Review recent default-branch checks, releases, and open maintenance issues using gh. Follow up existing problems with evidence, including unresolved documentation or container failures. Record actionable acceptance criteria and the human decision needed. Do not invent work, duplicate issues, or claim deployment recovery from a build.'             --check 'uv run pytest tests' --check 'uv run ty check' --check 'uv run zensical build -s'
      - name: Publish evidence summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/landing/summary.md" ]]; then
            cat "$RUNNER_TEMP/landing/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-duty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
