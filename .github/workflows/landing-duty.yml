name: Landing duty

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [release-main]
    types: [completed]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: landing-duty-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id || 'daily' }}
  cancel-in-progress: false

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      ((github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
       (github.event.comment.user.type != 'Bot' &&
        (github.event_name == 'pull_request_review_comment' || contains(github.event.comment.body, '/landing '))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: 2.97.0
          github-token: ${{ github.token }}
      - name: Prepare agent skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/prepare-skills.sh "$RUNNER_TEMP/landing-skills"
          echo "LANDING_SKILL_DIRS=[\"$RUNNER_TEMP/landing-skills\"]" >> "$GITHUB_ENV"
      - uses: fregante/setup-git-user@v2
      - name: Prepare GitHub Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Handle the event or daily maintenance
        uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
          LANDING_CONFIG: .github/landing.yml
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          command: triage
          delivery-key: ${{ format('duty:{0}', github.event.comment.id || github.run_id) }}
          instruction: Review default-branch checks, release evidence, and existing maintenance issues using gh. Reuse existing issues; reopen only a real recurrence and close only after verifying their acceptance criteria. Record concrete evidence and acceptance criteria. Do not create work for healthy checks or claim deployment recovery from a build.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-duty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
